<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BB-8 Settings</title>
<style>
/* Same look as /control: dark ember background, orange accent, glass cards. */
:root {
  --void:#040305; --obsidian:#0d0706; --ember:#2b0e04; --glow:#521905;
  --orange:#ff5a00; --orange-hi:#ff8533; --orange-soft:rgba(255,90,0,.14);
  --line:rgba(255,120,40,.18); --line-hi:rgba(255,120,40,.5);
  --card:rgba(16,10,9,.82); --field:rgba(255,255,255,.04); --ink:#faf6f2; --mute:#a8968b; --dim:#6e5d53;
  --ok:#10b981; --warn:#f59e0b; --bad:#ef4444; --flash:rgba(255,133,51,.16);
  --radius:14px;
}
* { box-sizing:border-box; }
html { color-scheme:dark; }
body { margin:0; min-height:100vh; color:var(--ink); font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  background:var(--void) fixed; background-image:linear-gradient(135deg, var(--void) 0%, var(--obsidian) 50%, var(--ember) 90%, var(--glow) 100%); }
a { color:var(--orange-hi); }
button, input, select { font:inherit; color:inherit; }

/* top bar */
.top { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:14px; padding:12px 20px;
  background:rgba(6,4,5,.78); border-bottom:1px solid var(--line); backdrop-filter:blur(14px); }
.logo { width:22px; height:22px; border-radius:50%; background:radial-gradient(circle at 32% 32%, var(--orange-hi), var(--orange)); box-shadow:0 0 16px rgba(255,90,0,.5); flex:none; }
.top h1 { font-size:17px; margin:0; letter-spacing:.02em; white-space:nowrap; }
.chip { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--mute); border:1px solid var(--line); border-radius:99px; padding:3px 10px; white-space:nowrap; }
.top .links { margin-left:auto; display:flex; gap:8px; }
.top .links a { font-size:13px; color:var(--ink); text-decoration:none; border:1px solid var(--line); border-radius:99px; padding:5px 12px; }
.top .links a:hover { border-color:var(--line-hi); }

/* layout */
.wrap { display:grid; grid-template-columns:220px minmax(0, 1fr); gap:24px; max-width:1100px; margin:0 auto; padding:24px 20px 80px; }
nav.side { position:sticky; top:76px; align-self:start; display:grid; gap:2px; }
nav.side a { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:10px; color:var(--mute); text-decoration:none; font-size:14px; }
nav.side a:hover { color:var(--ink); background:var(--field); }
nav.side a.on { color:var(--ink); background:var(--orange-soft); }
nav.side a.on svg { color:var(--orange-hi); }
nav.side .dot { margin-left:auto; width:7px; height:7px; border-radius:50%; background:var(--warn); }
svg.i { width:18px; height:18px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

.page { display:none; }
.page.on { display:grid; gap:16px; animation:fade .2s ease; }
@keyframes fade { from { opacity:0; transform:translateY(4px); } }
.page-head h2 { font-size:24px; margin:0; }
.page-head p { margin:4px 0 0; color:var(--mute); }

.card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; }
.card h3 { margin:0 0 4px; font-size:16px; }
.card > p.sub { margin:0 0 8px; color:var(--mute); font-size:14px; }

/* setting rows */
.set { display:grid; grid-template-columns:minmax(0, 1fr) minmax(160px, 280px); gap:4px 20px; align-items:center; padding:14px 0; border-top:1px solid var(--line); transition:background .6s; }
.set:first-child, .card > h3 + .set, .card > p.sub + .set { border-top:0; }
.set.flash { background:var(--flash); border-radius:8px; }
.set label.name { font-weight:550; }
.set .hint { grid-column:1; font-size:13px; color:var(--mute); }
.set .ctl { grid-column:2; grid-row:1 / span 2; display:flex; align-items:center; gap:10px; justify-content:flex-end; }
input.txt, select { width:100%; background:var(--field); border:1px solid var(--line); border-radius:10px; padding:9px 12px; outline:none; }
input.txt:focus, select:focus { border-color:var(--orange); box-shadow:0 0 0 3px var(--orange-soft); }
input.txt.err { border-color:var(--bad); }
select option { background:#1a1110; }
input[type=range] { flex:1; accent-color:var(--orange); min-width:0; }
.val { font-variant-numeric:tabular-nums; font-size:13px; color:var(--mute); min-width:62px; text-align:right; }
.saved { font-size:12px; color:var(--ok); opacity:0; transition:opacity .3s; white-space:nowrap; }
.set .ctl > span:first-child { flex:1; }
.saved.show { opacity:1; }

.switch { position:relative; width:44px; height:26px; flex:none; display:inline-block; }
.switch input { position:absolute; inset:0; opacity:0; margin:0; cursor:pointer; z-index:1; }
.switch span { position:absolute; inset:0; background:rgba(255,255,255,.12); border-radius:99px; transition:background .2s; }
.switch span::after { content:""; position:absolute; left:3px; top:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .2s; }
.switch input:checked + span { background:var(--orange); }
.switch input:checked + span::after { left:21px; }
.switch input:focus-visible + span { box-shadow:0 0 0 3px var(--orange-soft); }

details.more { margin-top:4px; }
details.more > summary { cursor:pointer; color:var(--mute); font-size:14px; padding:8px 0; list-style:none; }
details.more > summary::before { content:"▸ "; }
details.more[open] > summary::before { content:"▾ "; }

.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; border:0; border-radius:10px; padding:9px 16px; cursor:pointer; background:var(--orange); color:#fff; font-weight:600; text-decoration:none; font-size:14px; }
.btn:hover { background:var(--orange-hi); }
.btn.ghost { background:transparent; border:1px solid var(--line); color:var(--ink); font-weight:500; }
.btn.ghost:hover { border-color:var(--line-hi); }
.btn.small { padding:5px 12px; font-size:13px; }
.btn:disabled { opacity:.5; cursor:default; }
.linkbtn { background:none; border:0; color:var(--orange-hi); cursor:pointer; padding:0; font-size:14px; }

/* overview */
.grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:16px; }
.todo { list-style:none; margin:8px 0 0; padding:0; display:grid; gap:4px; }
.todo li { display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line); }
.todo li:first-child { border-top:0; }
.todo .tick { width:22px; height:22px; border-radius:50%; border:2px solid var(--dim); flex:none; display:grid; place-items:center; font-size:12px; }
.todo li.done .tick { border-color:var(--ok); background:var(--ok); color:#04130d; }
.todo li.done .what { color:var(--mute); }
.todo .what { flex:1; }
.todo .what small { display:block; color:var(--mute); font-size:12px; }

.status { display:flex; align-items:center; gap:8px; font-size:14px; }
.led { width:9px; height:9px; border-radius:50%; background:var(--dim); flex:none; }
.led.ok { background:var(--ok); box-shadow:0 0 8px rgba(16,185,129,.6); }
.led.warn { background:var(--warn); } .led.bad { background:var(--bad); }

/* chat */
.chat-log { display:flex; flex-direction:column; gap:8px; max-height:340px; min-height:120px; overflow:auto; padding:4px 0 10px; }
.msg { max-width:85%; padding:8px 12px; border-radius:14px; font-size:14px; white-space:pre-wrap; }
.msg.me { align-self:flex-end; background:var(--orange); color:#fff; border-bottom-right-radius:4px; }
.msg.bot { align-self:flex-start; background:var(--field); border:1px solid var(--line); border-bottom-left-radius:4px; }
.msg.wait { color:var(--mute); }
.chat-form { display:flex; gap:8px; }
.chat-empty { color:var(--mute); font-size:14px; margin:auto; text-align:center; }

/* services */
.svc-head { display:flex; align-items:flex-start; gap:14px; }
.svc-icon { width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:var(--orange-soft); color:var(--orange-hi); flex:none; }
.svc-icon svg.i { width:22px; height:22px; }
.svc-head .t { flex:1; min-width:0; }
.svc-head .t p { margin:2px 0 0; color:var(--mute); font-size:14px; }
.svc .status { margin-top:14px; }
.svc .asks { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; font-size:13px; color:var(--mute); align-items:center; }
.svc .asks q { border:1px solid var(--line); border-radius:99px; padding:3px 10px; color:var(--ink); }
.svc.off .body, .svc.off .asks { display:none; }
.svc .body { margin-top:10px; }
.apps { display:grid; gap:8px; margin-top:12px; }
.app { display:flex; align-items:center; gap:12px; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--field); }
.app .badge { width:32px; height:32px; border-radius:9px; display:grid; place-items:center; font-weight:700; background:rgba(255,255,255,.07); flex:none; }
.app .who { flex:1; min-width:0; }
.app .who b { display:block; }
.app .who span { font-size:13px; color:var(--mute); }
.add { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; align-items:center; }
.add span { font-size:13px; color:var(--mute); margin-right:4px; }
.tech { font-size:12px; color:var(--dim); margin-top:10px; word-break:break-word; }
.tech code { font-size:11px; border:1px solid var(--line); border-radius:6px; padding:1px 6px; margin:2px; display:inline-block; }

/* dialog */
dialog { width:min(520px, calc(100vw - 32px)); border:1px solid var(--line-hi); border-radius:18px; padding:0; color:var(--ink); background:#120b09; box-shadow:0 20px 60px rgba(0,0,0,.6); }
dialog::backdrop { background:rgba(0,0,0,.6); backdrop-filter:blur(3px); }
.dlg { padding:22px; display:grid; gap:14px; }
.dlg h3 { margin:0; font-size:19px; }
.dlg ol { margin:0; padding-left:20px; display:grid; gap:6px; color:var(--mute); font-size:14px; }
.dlg ol b { color:var(--ink); font-weight:600; }
.dlg .field { display:grid; gap:6px; }
.dlg .field label { font-weight:550; font-size:14px; }
.dlg .field small { color:var(--mute); font-size:12px; }
.dlg .result { display:none; align-items:center; gap:8px; padding:10px 12px; border-radius:10px; font-size:14px; }
.dlg .result.show { display:flex; }
.dlg .result.ok { background:rgba(16,185,129,.12); color:#6ee7b7; }
.dlg .result.bad { background:rgba(239,68,68,.12); color:#fca5a5; }
.dlg .result.busy { background:var(--field); color:var(--mute); }
.dlg .actions { display:flex; gap:8px; justify-content:flex-end; }
.spin { width:14px; height:14px; border:2px solid var(--dim); border-top-color:var(--orange); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.copy { display:flex; gap:6px; align-items:center; }
.copy code { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; background:var(--field); border:1px solid var(--line); border-radius:8px; padding:7px 10px; }

/* activity */
ul.plain { list-style:none; margin:0; padding:0; }
ul.plain li { padding:8px 0; border-top:1px solid var(--line); font-size:13px; color:var(--mute); }
ul.plain li:first-child { border-top:0; }
ul.plain li b { color:var(--ink); font-weight:550; }
.clip { display:grid; gap:6px; padding:10px 0; border-top:1px solid var(--line); }
.clip:first-child { border-top:0; }
.clip audio { width:100%; height:34px; }
.empty { color:var(--mute); font-size:14px; }

#toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(10px); background:#1d1311; border:1px solid var(--line-hi); padding:9px 16px; border-radius:10px; opacity:0; transition:all .25s; pointer-events:none; z-index:20; font-size:14px; }
#toast.show { opacity:1; transform:translateX(-50%); }

@media (max-width: 760px) {
  .wrap { grid-template-columns:1fr; padding:12px 16px 80px; gap:14px; }
  nav.side { position:sticky; top:57px; z-index:4; display:flex; overflow-x:auto; gap:4px; margin:0 -16px; padding:8px 16px; background:rgba(6,4,5,.9); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
  nav.side a { white-space:nowrap; padding:7px 10px; }
  nav.side .dot { margin-left:4px; }
  .top { padding:10px 16px; gap:10px; }
  #head-chip { display:none; }
  .top .links a { padding:5px 10px; }
  .set { grid-template-columns:1fr; }
  .set .ctl { grid-column:1; grid-row:auto; justify-content:flex-start; }
  .page-head h2 { font-size:21px; }
}
</style>
</head>
<body>
<header class="top">
  <span class="logo"></span><h1>BB-8</h1>
  <span class="chip"><span class="led" id="live-led"></span><span id="live-txt">connecting…</span></span>
  <span class="chip" id="head-chip">head offline</span>
  <div class="links"><a id="control-link" href="/control">Drive</a><a id="people-link" href="/people">People</a></div>
</header>

<div class="wrap">
  <nav class="side" id="nav"></nav>
  <main id="pages"></main>
</div>

<dialog id="dlg"><form method="dialog" class="dlg" id="dlg-body"></form></dialog>
<div id="toast"></div>

<script>
const q = new URLSearchParams(location.search);
let token = q.get("token") || "";
try { if (token) localStorage.setItem("bb8-token", token); else token = localStorage.getItem("bb8-token") || ""; } catch (e) {}
const tq = token ? "?token=" + encodeURIComponent(token) : "";
document.getElementById("control-link").href = "/control" + tq;
document.getElementById("people-link").href = "/people" + tq;
const auth = token ? { Authorization: "Bearer " + token } : {};

let schema = [], values = {}, rev = 0, conns = [], liveInfo = {};
const el = (t, a = {}, ...kids) => { const e = document.createElement(t); for (const [k, v] of Object.entries(a)) { if (k === "class") e.className = v; else if (k in e) e[k] = v; else e.setAttribute(k, v); } e.append(...kids.filter(k => k !== null && k !== undefined && k !== false)); return e; };
const $ = (s, r = document) => r.querySelector(s);
const toast = (m) => { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2200); };
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", ...auth, ...(opts.headers || {}) } });
  const body = await r.json().catch(() => ({}));
  return { ok: r.ok, status: r.status, body };
}

// patch writes several settings at once; on a stale rev it reloads and retries once.
async function patch(vals) {
  for (let i = 0; i < 2; i++) {
    const r = await api("/api/config", { method: "PATCH", body: JSON.stringify({ baseRev: rev, values: vals }) });
    if (r.status === 409) { applyConfig(r.body); continue; }
    if (r.ok) applyConfig(r.body);
    return r;
  }
  return { ok: false, body: { error: "Changed elsewhere meanwhile, try again." } };
}

// ---------- icons (simple strokes) ----------
const ICON = {
  overview: '<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
  brain: '<path d="M12 3l2.3 5.7L20 11l-5.7 2.3L12 19l-2.3-5.7L4 11l5.7-2.3z"/><path d="M19 3v4M17 5h4"/>',
  home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v12h14V9"/><path d="M10 21v-6h4v6"/>',
  voice: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  services: '<path d="M9 2v5M15 2v5"/><path d="M6 7h12v4a6 6 0 0 1-12 0z"/><path d="M12 17v5"/>',
  driving: '<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/>',
  calibration: '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  activity: '<path d="M3 12h4l3-8 4 16 3-8h4"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  apps: '<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><path d="M17.5 14v7M14 17.5h7"/>',
};
const icon = (n) => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("class", "i"); s.innerHTML = ICON[n] || ""; return s; };

// ---------- how each setting is shown (the schema stays the source of truth) ----------
// label/hint override the schema's; slider shows a range; fmt formats its value.
const pct = (max) => (v) => Math.round(v / max * 100) + "%";
const UI = {
  "agent.api_key": { label: "OpenRouter key", hint: "BB-8 thinks with it. Get one at openrouter.ai/keys." },
  "agent.model": { label: "AI model", hint: "Any OpenRouter model that can use tools." },
  "agent.vision": { label: "Let it see photos" },
  "home.owner": { label: "Your name" },
  "home.city": { label: "City", hint: "For the weather and the local time. Just the city name works best." },
  "home.timezone": { label: "Time zone" },
  "head.volume": { label: "Volume", slider: true, step: 0.05, fmt: pct(1) },
  "voice.speed": { label: "Speech speed", hint: "How fast BB-8 talks.", slider: true, step: 0.05, fmt: (v) => v.toFixed(2) + "×" },
  "head.eye_brightness": { label: "Eye brightness", slider: true, step: 0.01, fmt: pct(0.3) },
  "voice.audio_log": { label: "Keep the last voice clips", hint: "The last 20 phrases it heard, in memory only. Handy to tune the microphone." },
  "motion.pwm_cruise": { label: "Driving speed", hint: "How fast it drives straight. 88% ≈ 0.5 m/s.", slider: true, step: 1, fmt: pct(160) },
  "motion.pwm_turn": { label: "Turning speed", slider: true, step: 1, fmt: pct(160) },
  "motion.pwm_manual_max": { label: "Gamepad top speed", hint: "Fastest it goes with the gamepad.", slider: true, step: 1, fmt: pct(160) },
  "motion.move_max_m": { label: "Longest move per order", slider: true, step: 0.1, fmt: (v) => v + " m" },
  "motion.turn_max_deg": { slider: true, step: 5, fmt: (v) => v + "°" },
  "motion.head_max_deg": { label: "How far the head turns", slider: true, step: 1, fmt: (v) => "±" + v + "°" },
  "motion.blind_max_m": { slider: true, step: 0.05, fmt: (v) => v + " m" },
  "motion.obstacle_memory_m": { slider: true, step: 0.05, fmt: (v) => v ? v + " m" : "off" },
  "motion.manual_hold_s": { slider: true, step: 0.1, fmt: (v) => v + " s" },
  "motion.order_max_s": { slider: true, step: 0.5, fmt: (v) => v + " s" },
  "navigation.planner": { label: "Who picks each step", hint: "auto: JEV when its key is set, otherwise simple built-in rules." },
  "navigation.jev_api_key": { label: "JEV key (TypeSafe)", hint: "Optional. Faster, smarter steps when driving to a room." },
  "navigation.min_confidence": { slider: true, step: 0.05, fmt: pct(1) },
};

const PAGES = [
  { id: "overview", title: "Overview", sub: "What BB-8 needs and a quick chat." },
  { id: "brain", title: "Brain", sub: "The AI that understands you and decides what to do.",
    main: ["agent.api_key", "agent.model"], more: ["agent.vision", "agent.max_steps", "agent.max_tokens", "agent.history_messages", "agent.reset_after_s", "agent.base_url"] },
  { id: "home", title: "Home", sub: "Where BB-8 lives and who it belongs to.",
    main: ["home.owner", "home.city", "home.timezone"], more: ["home.latitude", "home.longitude"] },
  { id: "voice", title: "Voice & eye", sub: "How BB-8 sounds and glows.",
    main: ["head.volume", "voice.speed", "head.eye_brightness", "voice.audio_log"] },
  { id: "services", title: "Services", sub: "Weather, the web, your calendar and apps BB-8 can use." },
  { id: "driving", title: "Driving", sub: "How fast and how far BB-8 may move. The robot also brakes by itself for obstacles and tilts.",
    main: ["motion.pwm_cruise", "motion.pwm_turn", "motion.pwm_manual_max", "motion.move_max_m", "motion.head_max_deg", "navigation.jev_api_key"],
    more: ["motion.turn_max_deg", "motion.manual_hold_s", "motion.order_max_s", "motion.blind_max_m", "motion.obstacle_memory_m", "navigation.planner", "navigation.jev_model", "navigation.min_confidence", "navigation.max_steps"] },
  { id: "calibration", title: "Calibration", sub: "Measurements of this robot. Set them once with the calibration guide.",
    main: ["motion.wheel_diameter_m", "motion.ticks_per_rev", "motion.track_width_m", "motion.slip_factor", "motion.pwm_min", "motion.pwm_turn_min"] },
  { id: "activity", title: "Activity", sub: "Recent changes and what BB-8 heard." },
];
// Settings not placed above land in "More" of the page for their section.
const SECTION_PAGE = { agent: "brain", home: "home", head: "voice", voice: "voice", motion: "driving", navigation: "driving" };

// ---------- setting rows ----------
function control(f) {
  const ui = UI[f.key] || {};
  const id = "f-" + f.key;
  let i, extra = null;
  if (f.type === "bool") {
    i = el("input", { type: "checkbox", id });
    return [el("label", { class: "switch" }, i, el("span")), i];
  }
  if (f.type === "enum") i = el("select", { class: "txt", id }, ...f.options.map(o => el("option", { value: o, textContent: o })));
  else if (f.type === "number" && ui.slider && f.min !== undefined && f.max !== undefined) {
    i = el("input", { type: "range", id, min: f.min, max: f.max, step: ui.step || "any" });
    extra = el("span", { class: "val" });
    i.addEventListener("input", () => { extra.textContent = (ui.fmt || String)(Number(i.value)); });
    return [el("span", { style: "display:flex;flex:1;gap:10px;align-items:center" }, i, extra), i];
  } else if (f.type === "number") i = el("input", { class: "txt", type: "number", step: "any", id, min: f.min ?? "", max: f.max ?? "" });
  else if (f.type === "secret") i = el("input", { class: "txt", type: "password", id, autocomplete: "off" });
  else i = el("input", { class: "txt", type: "text", id });
  return [i, i];
}

function settingRow(f) {
  const ui = UI[f.key] || {};
  const [ctl, i] = control(f);
  const saved = el("span", { class: "saved", textContent: "Saved ✓" });
  const hint = [ui.hint || f.help, f.agent ? "You can also ask BB-8 to change it." : "", f.restart ? "Applies after a restart." : ""].filter(Boolean).join(" ");
  const row = el("div", { class: "set", id: "row-" + f.key },
    el("label", { class: "name", htmlFor: i.id, textContent: ui.label || f.label || f.key }),
    el("div", { class: "ctl" }, ctl, saved),
    hint ? el("div", { class: "hint", textContent: hint }) : null);
  i.addEventListener("change", async () => {
    let v = f.type === "bool" ? i.checked : f.type === "number" ? (i.value === "" ? null : Number(i.value)) : i.value;
    if (v === null) return;
    if (f.type === "secret") { if (v === "") return; v = v.trim(); }
    const r = await patch({ [f.key]: v });
    if (!r.ok) { i.classList.add("err"); toast(r.body.error || "Could not save"); return; }
    i.classList.remove("err");
    if (f.type === "secret") i.value = "";
    saved.classList.add("show"); setTimeout(() => saved.classList.remove("show"), 1600);
  });
  return row;
}

function showValue(key, v, flash) {
  const f = schema.find(x => x.key === key), i = document.getElementById("f-" + key);
  if (!f || !i || document.activeElement === i) return;
  if (f.type === "bool") i.checked = !!v;
  else if (f.type === "secret") { i.value = ""; i.placeholder = v ? "Saved · type to replace" : "Not set"; }
  else i.value = v ?? "";
  if (i.type === "range") i.dispatchEvent(new Event("input"));
  if (flash) { const r = $("#row-" + CSS.escape(key)); if (r) { r.classList.add("flash"); setTimeout(() => r.classList.remove("flash"), 1000); } }
}

// goTo opens the page that holds a setting and focuses it.
function goTo(key) {
  const page = PAGES.find(p => (p.main || []).includes(key) || (p.more || []).includes(key)) || PAGES.find(p => p.id === SECTION_PAGE[key.split(".")[0]]);
  if (page) location.hash = page.id;

    row.classList.add("flash"); setTimeout(() => row.classList.remove("flash"), 1500);

function friendly(err) {
  if (/401|403|unauthori[sz]ed|forbidden/i.test(err)) return "The token was not accepted. Check it.";
  if (/refused|no such host|dial tcp|timeout|deadline|unreachable|EOF/i.test(err)) return "Can't reach it. Check the address and that it's online.";
  if (/404|not found/i.test(err)) return "Nothing at that address. Check it.";
  return "It didn't work (see Technical details).";
}

// mcpServers parses "name: 12 tools; other: error…" into {name: {ok, n, err}}.
function mcpServers(c) {
  const out = {};
  for (const part of (c?.detail || "").split("; ")) {
    const i = part.indexOf(": "); if (i <= 0) continue;
    const name = part.slice(0, i), d = part.slice(i + 2), m = d.match(/^(\d+) tools$/);
    out[name] = m ? { ok: true, n: Number(m[1]) } : { ok: false, err: d };
  }
  return out;
}
const slots = () => [1, 2, 3].filter(n => schema.some(f => f.key === "connectors.mcp." + n + ".name"));
const usedSlots = () => slots().filter(n => values["connectors.mcp." + n + ".name"] || values["connectors.mcp." + n + ".url"]);

function svcMessage(c) {
  if (c.state === "disabled") return ["", "Off"];
  if (c.id === "weather") {
    if (c.state === "needs_config") return ["warn", "Tell BB-8 your city.", "home.city", "Set city"];
    if (c.state === "error") return ["bad", "Couldn't find your city. Try just its name, like “Ciudad Juárez”.", "home.city", "Change city"];
    return ["ok", c.detail?.startsWith("Home: ") ? "Ready · " + c.detail.slice(6) : "Ready"];
  }
  if (c.id === "web") return c.state === "needs_config" ? ["warn", "Needs the OpenRouter key (BB-8's brain).", "agent.api_key", "Add key"] : ["ok", "Ready"];
  if (c.id === "calendar") {
    if (c.state === "needs_auth") return ["warn", "Almost there: sign in with Google."];
    if (c.state === "needs_config") return ["warn", "Not set up yet."];
    if (c.state === "error") return ["bad", friendly(c.detail || "")];
    return ["ok", "Connected to Google"];
  }
  if (c.id === "mcp") {
    const used = usedSlots().length;
    if (!used) return ["warn", "Nothing connected yet."];
    const sv = Object.values(mcpServers(c)), bad = sv.filter(s => !s.ok).length, n = sv.reduce((a, s) => a + (s.n || 0), 0);
    if (!sv.length) return ["warn", "Connecting…"];
    if (bad) return ["bad", bad === 1 ? "One app has a problem." : bad + " apps have a problem."];
    return ["ok", "Ready · " + n + " actions"];
  }
  return [c.state === "ok" ? "ok" : "warn", c.detail || c.state];
}

// appDialog connects (or edits) one app. Nothing is saved until Connect; then
// it waits for the connection result and shows it in the dialog.
function appDialog(kind, slot) {
  const app = APPS[kind], dlg = $("#dlg"), editing = !!slot;
  slot = slot || slots().find(n => !usedSlots().includes(n));
  if (!slot) { toast("You can connect up to 3 apps. Remove one first."); return; }
  const k = (f) => "connectors.mcp." + slot + "." + f;
  const cur = editing ? { url: values[k("url")] || "", ...(app.fromUrl ? app.fromUrl(values[k("url")] || "") : {}) } : {};
  const inputs = {};
  const fields = app.ask.map(a => {
    const i = el("input", { class: "txt", type: a.secret ? "password" : "text", placeholder: editing && a.secret && values[k("token")] ? "Saved · leave empty to keep" : a.ph, value: cur[a.id] ?? a.def ?? "", autocomplete: "off" });
    inputs[a.id] = i;
    return el("div", { class: "field" }, el("label", { textContent: a.label }), i);
  });
  const strangers = el("input", { type: "checkbox", checked: !!values[k("unknown_voices")] });
  const result = el("div", { class: "result" });
  const go = el("button", { class: "btn", type: "button", textContent: editing ? "Save and test" : "Connect" });
  const cancel = el("button", { class: "btn ghost", type: "button", textContent: editing ? "Close" : "Cancel" });
  const remove = editing ? el("button", { class: "linkbtn", type: "button", textContent: "Disconnect", style: "margin-right:auto;color:var(--bad)" }) : null;
  let connected = editing;
  $("#dlg-body").replaceChildren(
    el("h3", { textContent: (editing ? "" : "Connect ") + app.label }), el("p", { style: "margin:-8px 0 0;color:var(--mute);font-size:14px", textContent: app.what }),
    stepsList(app.steps), ...fields,
    el("details", { class: "more" }, el("summary", { textContent: "More options" }),
      el("label", { style: "display:flex;gap:10px;align-items:center;font-size:14px" }, el("span", { class: "switch" }, strangers, el("span")), "Voices BB-8 doesn't know may use it too")),
    result, el("div", { class: "actions" }, remove, cancel, go));
  const say = (cls, msg) => { result.className = "result show " + cls; result.replaceChildren(cls === "busy" ? el("span", { class: "spin" }) : "", msg); };

  go.onclick = async () => {
    const a = {};
    for (const [id, i] of Object.entries(inputs)) a[id] = i.value.trim();
    const need = app.ask.find(x => !x.optional && !a[x.id] && !(x.secret && editing && values[k("token")]));
    if (need) { inputs[need.id].focus(); say("bad", "Fill in “" + need.label + "”."); return; }
    const url = app.url ? app.url(a) : a.url;
    if (!/^https?:\/\/\S+$/.test(url)) { say("bad", "That doesn't look like a link. It should start with https://"); return; }
    let name = editing ? values[k("name")] : app.name || (new URL(url).hostname.split(".").find(p => !/^(www|mcp|api)$/.test(p)) || "app").replace(/[^a-z0-9]/gi, "").toLowerCase();
    if (!editing) { const taken = usedSlots().filter(n => n !== slot).map(n => values["connectors.mcp." + n + ".name"]); let base = name, i = 2; while (taken.includes(name)) name = base + i++; }
    const vals = { "connectors.mcp.enabled": true, [k("name")]: name, [k("url")]: url, [k("unknown_voices")]: strangers.checked };
    if (a.token) vals[k("token")] = a.token;
    go.disabled = true; say("busy", "Connecting…");
    const r = await patch(vals);
    if (!r.ok) { go.disabled = false; say("bad", r.body.error || "Could not save."); return; }
    // wait for the connector to report this server
    let s;
    for (let t = 0; t < 24 && !s; t++) { await sleep(500); await loadStatus(); s = mcpServers(conns.find(c => c.id === "mcp"))[name]; }
    go.disabled = false; connected = true;
    if (!s) { say("bad", "No answer yet. It may still be connecting; check back in a moment."); return; }
    if (!s.ok) { say("bad", friendly(s.err)); go.textContent = "Try again"; return; }
    say("ok", "Connected · BB-8 can now use " + s.n + " actions from " + app.label + ".");
    go.textContent = "Done"; go.onclick = () => dlg.close();
  };
  // A new app that never connected is removed on Cancel, so no broken leftovers.
  cancel.onclick = async () => { if (!editing && connected && !result.classList.contains("ok")) await clearSlot(slot); dlg.close(); };
  if (remove) remove.onclick = async () => { if (confirm("Disconnect " + app.label + "?")) { await clearSlot(slot); dlg.close(); toast("Disconnected"); } };
  $("#dlg-body").onsubmit = (e) => { e.preventDefault(); go.click(); };
  dlg.oncancel = (e) => { e.preventDefault(); cancel.onclick(); };
  dlg.showModal();
  (Object.values(inputs).find(i => !i.value) || go).focus();
}

async function clearSlot(n) {
  const vals = {};
  for (const f of ["name", "url", "token"]) vals["connectors.mcp." + n + "." + f] = "";
  vals["connectors.mcp." + n + ".unknown_voices"] = false;
  await patch(vals);
  statusSoon();
}

function calendarDialog() {
  const dlg = $("#dlg");
  const id = el("input", { class: "txt", placeholder: "…apps.googleusercontent.com", value: values["connectors.calendar.google_client_id"] || "" });
  const secret = el("input", { class: "txt", type: "password", placeholder: values["connectors.calendar.google_client_secret"] ? "Saved · leave empty to keep" : "Client secret" });
  const redirect = values["connectors.calendar.google_redirect_url"] || "";
  const result = el("div", { class: "result" });
  const go = el("button", { class: "btn", type: "button", textContent: "Sign in with Google" });
  $("#dlg-body").replaceChildren(
    el("h3", { textContent: "Google Calendar" }),
    el("p", { style: "margin:-8px 0 0;color:var(--mute);font-size:14px", textContent: "BB-8 talks to Google directly. This needs a free Google Cloud project; with Zapier it's easier." }),
    stepsList([["In ", ["Google Cloud", "https://console.cloud.google.com/apis/library/calendar-json.googleapis.com"], ", turn on the ", "Google Calendar API", "."],
      ["In ", ["Credentials", "https://console.cloud.google.com/apis/credentials"], " create an ", "OAuth client", " of type Web application, with this redirect address:"]]),
    el("div", { class: "copy" }, el("code", { textContent: redirect }), el("button", { class: "btn ghost small", type: "button", textContent: "Copy", onclick: () => { navigator.clipboard?.writeText(redirect); toast("Copied"); } })),
    el("div", { class: "field" }, el("label", { textContent: "Client ID" }), id),
    el("div", { class: "field" }, el("label", { textContent: "Client secret" }), secret),
    result, el("div", { class: "actions" }, el("button", { class: "btn ghost", type: "button", textContent: "Cancel", onclick: () => dlg.close() }), go));
  go.onclick = async () => {
    if (!id.value.trim() || (!secret.value.trim() && !values["connectors.calendar.google_client_secret"])) { result.className = "result show bad"; result.textContent = "Paste the client ID and secret."; return; }
    const vals = { "connectors.calendar.enabled": true, "connectors.calendar.google_client_id": id.value.trim() };
    if (secret.value.trim()) vals["connectors.calendar.google_client_secret"] = secret.value.trim();
    const r = await patch(vals);
    if (!r.ok) { result.className = "result show bad"; result.textContent = r.body.error || "Could not save."; return; }
    location.href = "/api/connectors/calendar/auth" + tq;
  };
  $("#dlg-body").onsubmit = (e) => { e.preventDefault(); go.click(); };
  dlg.oncancel = null;
  dlg.showModal();
}

// ---------- live data ----------
function applyConfig(cfg) {
  if (!cfg || cfg.rev === undefined) return;
  rev = cfg.rev;
  Object.assign(values, cfg.values || {});
  for (const [k, v] of Object.entries(cfg.values || {})) showValue(k, v, false);
  if (cfg.live) applyLive(cfg.live);
}
function applyLive(l) {
  liveInfo = l;
  const h = l.head || {};
  $("#head-chip").textContent = h.connected ? "head connected" : "head offline";
  if (l.connectors) { conns = l.connectors; refreshServices(); }
  refreshOverview();
}
async function loadStatus() { const r = await api("/api/connectors"); if (r.ok) { conns = r.body; refreshServices(); refreshOverview(); } }
let statusTimer; const statusSoon = () => { clearTimeout(statusTimer); statusTimer = setTimeout(loadStatus, 1200); };

function addAudit(c) {
  const ul = $("#audit"); if (!ul) return;
  const what = Object.entries(c.values).map(([k, v]) => (UI[k]?.label || schema.find(f => f.key === k)?.label || k) + " → " + (typeof v === "boolean" ? (v ? "on" : "off") : JSON.stringify(v))).join(", ");
  ul.prepend(el("li", {}, el("b", { textContent: new Date(c.at).toLocaleTimeString() }), " · " + ({ web: "this page", agent: "BB-8", voice: "voice" }[c.source] || c.source) + " · " + what));
  while (ul.children.length > 30) ul.lastChild.remove();
}

function connect() {
  const es = new EventSource("/api/config/events" + tq);
  es.addEventListener("hello", async (e) => {
    $("#live-led").className = "led ok"; $("#live-txt").textContent = "online";
    if (JSON.parse(e.data).rev !== rev) applyConfig((await api("/api/config")).body);
  });
  es.addEventListener("change", (e) => {
    const c = JSON.parse(e.data);
    rev = Math.max(rev, c.rev);
    Object.assign(values, c.values);
    for (const [k, v] of Object.entries(c.values)) showValue(k, v, true);
    addAudit(c);
    if (Object.keys(c.values).some(k => /^(connectors|home|agent)\./.test(k))) statusSoon();
    refreshOverview();
  });
  es.onerror = () => { $("#live-led").className = "led bad"; $("#live-txt").textContent = "reconnecting…"; };
}

let clipsSig = "";
async function clipsRefresh() {
  const r = await api("/api/audio"); if (!r.ok) return;
  $("#clips-off").hidden = r.body.enabled;
  const clips = r.body.clips || [], sig = clips.map(c => c.id + ":" + (c.text || "")).join(",");
  if (sig === clipsSig) return;
  clipsSig = sig;
  $("#clips").replaceChildren(...(clips.length ? clips.map(c => el("div", { class: "clip" },
    el("div", {}, el("b", { textContent: c.text ? "«" + c.text + "»" : "(no text)" }), el("span", { class: "empty", textContent: "  " + new Date(c.at).toLocaleTimeString() + " · " + c.seconds.toFixed(1) + " s" })),
    el("audio", { controls: true, preload: "metadata", src: "/api/audio/" + c.id + ".wav" + tq }))) : (r.body.enabled ? [el("p", { class: "empty", textContent: "Nothing yet. Say «Oye BB-8» and something." })] : [])));
}

(async () => {
  const s = await api("/api/config/schema");
  if (!s.ok) { $("#pages").replaceChildren(el("div", { class: "card" }, el("h3", { textContent: s.status === 401 ? "Open this page with its link (…?token=…)" : "Can't reach BB-8" }))); return; }
  schema = s.body;
  buildPages(); route();
  applyConfig((await api("/api/config")).body);
  await loadStatus();
  const au = await api("/api/config/audit");
  if (Array.isArray(au.body)) au.body.forEach(addAudit);
  connect();
  setInterval(async () => { const r = await api("/api/config"); if (r.ok && r.body.live) applyLive(r.body.live); }, 5000);
  clipsRefresh(); setInterval(clipsRefresh, 4000);
})();
</script>
