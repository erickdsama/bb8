<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BB-8 Config</title>
<style>
:root { --bg:#f6f5f2; --card:#fff; --ink:#1d1d1b; --mute:#6b6a65; --line:#e3e1db; --accent:#e8742a; --ok:#2f8a4c; --bad:#c23b2b; --flash:#fff1d6; }
@media (prefers-color-scheme: dark) { :root { --bg:#151514; --card:#1f1f1d; --ink:#ecebe6; --mute:#9a9891; --line:#33322f; --flash:#3a2f1a; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, sans-serif; }
header { display:flex; align-items:center; gap:12px; padding:16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
h1 { font-size:18px; margin:0; }
.dot { width:10px; height:10px; border-radius:50%; background:var(--bad); display:inline-block; }
.dot.on { background:var(--ok); }
.pill { font-size:12px; color:var(--mute); }
main { max-width:860px; margin:0 auto; padding:16px; display:grid; gap:16px; }
section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--mute); margin:0 0 8px; }
.row { display:grid; grid-template-columns: 1fr minmax(120px, 220px); gap:6px 12px; align-items:center; padding:8px 0; border-top:1px solid var(--line); transition: background .6s; }
.row:first-of-type { border-top:0; }
.row.flash { background:var(--flash); }
label { font-weight:500; }
.help { grid-column:1 / -1; font-size:12px; color:var(--mute); margin-top:-4px; }
input, select, textarea, button { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:6px 8px; width:100%; }
input[type=checkbox] { width:auto; justify-self:start; transform:scale(1.2); }
input.err { border-color:var(--bad); }
button { background:var(--accent); color:#fff; border:0; cursor:pointer; width:auto; padding:8px 14px; }
#audit { font-size:12px; color:var(--mute); margin:0; padding-left:18px; }
#toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:8px 14px; border-radius:8px; opacity:0; transition:opacity .3s; pointer-events:none; max-width:90vw; }
#toast.show { opacity:1; }
#chat-log { font-size:14px; white-space:pre-wrap; max-height:260px; overflow:auto; margin-bottom:8px; }
.chat-form { display:flex; gap:8px; }
</style>
</head>
<body>
<header>
  <h1>BB-8</h1>
  <span><span id="link-dot" class="dot"></span> <span class="pill" id="link-txt">offline</span></span>
  <span class="pill" id="head-txt"></span>
  <a id="control-link" href="/control" style="margin-left:auto;font-size:13px">Control</a>
  <span class="pill" id="rev-txt"></span>
</header>
<main>
  <div id="sections"></div>
  <section id="chat" hidden>
    <h2>Talk to BB-8 (agent)</h2>
    <div id="chat-log"></div>
    <form class="chat-form" id="chat-form"><input id="chat-in" placeholder="Hola BB-8…" autocomplete="off"><button>Send</button></form>
  </section>
  <section><h2>Recent changes</h2><ul id="audit"></ul></section>
</main>
<div id="toast"></div>
<script>
const q = new URLSearchParams(location.search);
let token = q.get("token") || "";
try { if (token) localStorage.setItem("bb8-token", token); else token = localStorage.getItem("bb8-token") || ""; } catch (e) {}
if (token) document.getElementById("control-link").href = "/control?token=" + encodeURIComponent(token);
const auth = token ? { Authorization: "Bearer " + token } : {};
let schema = [], rev = 0;
const el = (t, a = {}, ...kids) => { const e = document.createElement(t); Object.assign(e, a); e.append(...kids); return e; };
const toast = (m) => { const t = document.getElementById("toast"); t.textContent = m; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2500); };

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", ...auth, ...(opts.headers || {}) } });
  const body = await r.json().catch(() => ({}));
  return { ok: r.ok, status: r.status, body };
}

function input(f) {
  let i;
  if (f.type === "bool") i = el("input", { type: "checkbox" });
  else if (f.type === "enum") i = el("select", {}, ...f.options.map(o => el("option", { value: o, textContent: o })));
  else if (f.type === "number") i = el("input", { type: "number", step: "any", min: f.min ?? "", max: f.max ?? "" });
  else if (f.type === "secret") i = el("input", { type: "password", placeholder: "not set", autocomplete: "off" });
  else i = el("input", { type: "text" });
  i.id = "f-" + f.key;
  i.addEventListener("change", () => save(f, i));
  return i;
}

function read(f, i) {
  if (f.type === "bool") return i.checked;
  if (f.type === "number") return i.value === "" ? null : Number(i.value);
  return i.value;
}

function show(key, v, flash) {
  const f = schema.find(x => x.key === key), i = document.getElementById("f-" + key);
  if (!f || !i || document.activeElement === i) return;
  if (f.type === "bool") i.checked = !!v;
  else if (f.type === "secret") { i.value = ""; i.placeholder = v ? "set (type to replace, clear with a space)" : "not set"; }
  else i.value = v ?? "";
  i.classList.remove("err");
  if (flash) { const row = i.closest(".row"); row.classList.add("flash"); setTimeout(() => row.classList.remove("flash"), 900); }
}

async function save(f, i) {
  let v = read(f, i);
  if (v === null) return;
  if (f.type === "secret" && v === " ") v = "";
  const r = await api("/api/config", { method: "PATCH", body: JSON.stringify({ baseRev: rev, values: { [f.key]: v } }) });
  if (r.status === 409) { apply(r.body); toast("Changed elsewhere meanwhile; reloaded. Try again."); return; }
  if (!r.ok) { i.classList.add("err"); toast(r.body.error || "Error"); return; }
  apply(r.body);
  toast("Saved" + (f.restart ? " (applies after restart)" : ""));
}

function apply(cfg) {
  rev = cfg.rev;
  document.getElementById("rev-txt").textContent = "rev " + rev;
  for (const [k, v] of Object.entries(cfg.values || {})) show(k, v, false);
  live(cfg.live || {});
}

function live(l) {
  const h = l.head || {};
  document.getElementById("head-txt").textContent = h.connected ? "head connected" + (h.config_rev !== undefined ? " · head rev " + h.config_rev : "") : "head offline";
}

function build() {
  const groups = {};
  for (const f of schema) (groups[f.key.split(".")[0]] ||= []).push(f);
  const root = document.getElementById("sections");
  root.replaceChildren(...Object.entries(groups).map(([name, fs]) =>
    el("section", {}, el("h2", { textContent: name }), ...fs.map(f => {
      const row = el("div", { className: "row" }, el("label", { htmlFor: "f-" + f.key, textContent: f.label || f.key }), input(f));
      const extra = [f.help, f.agent ? "BB-8 can change this by voice." : "", f.restart ? "Needs a restart." : ""].filter(Boolean).join(" ");
      if (extra) row.append(el("div", { className: "help", textContent: extra }));
      return row;
    }))));
}

function addAudit(c) {
  const ul = document.getElementById("audit");
  const vals = Object.entries(c.values).map(([k, v]) => k + " = " + JSON.stringify(v)).join(", ");
  ul.prepend(el("li", { textContent: new Date(c.at).toLocaleTimeString() + " · " + c.source + " · " + vals }));
  while (ul.children.length > 20) ul.lastChild.remove();
}

function connect() {
  const es = new EventSource("/api/config/events" + (token ? "?token=" + encodeURIComponent(token) : ""));
  const dot = document.getElementById("link-dot"), txt = document.getElementById("link-txt");
  es.addEventListener("hello", async (e) => {
    dot.classList.add("on"); txt.textContent = "live";
    if (JSON.parse(e.data).rev !== rev) apply((await api("/api/config")).body);
  });
  es.addEventListener("change", (e) => {
    const c = JSON.parse(e.data);
    rev = Math.max(rev, c.rev);
    document.getElementById("rev-txt").textContent = "rev " + rev;
    for (const [k, v] of Object.entries(c.values)) show(k, v, true);
    addAudit(c);
  });
  es.onerror = () => { dot.classList.remove("on"); txt.textContent = "reconnecting…"; };
}

async function chatInit() {
  const r = await api("/api/agent", { method: "GET" });
  if (!r.ok) return;
  document.getElementById("chat").hidden = false;
  const log = document.getElementById("chat-log");
  document.getElementById("chat-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const inp = document.getElementById("chat-in"), text = inp.value.trim();
    if (!text) return;
    inp.value = ""; log.textContent += "Tú: " + text + "\n";
    const a = await api("/api/agent/ask", { method: "POST", body: JSON.stringify({ text, speaker_known: true }) });
    log.textContent += "BB-8: " + (a.body.reply || a.body.error || "…") + "\n";
    log.scrollTop = log.scrollHeight;
  });
}

(async () => {
  const s = await api("/api/config/schema");
  if (!s.ok) { toast(s.status === 401 ? "Open with ?token=…" : "Cannot load config"); return; }
  schema = s.body; build();
  apply((await api("/api/config")).body);
  (await api("/api/config/audit")).body.forEach?.(addAudit);
  setInterval(async () => { const r = await api("/api/config"); if (r.ok) live(r.body.live || {}); }, 3000);
  connect(); chatInit();
})();
</script>
</body>
</html>
