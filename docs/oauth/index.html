<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>BB-8 sign-in</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0d0706; color:#faf6f2; font:16px/1.5 system-ui, sans-serif; }
  main { max-width:420px; padding:24px; text-align:center; }
  .logo { width:28px; height:28px; border-radius:50%; margin:0 auto 12px; background:radial-gradient(circle at 32% 32%, #ff8533, #ff5a00); box-shadow:0 0 18px rgba(255,90,0,.5); }
  p { color:#a8968b; }
</style>
</head>
<body>
<main>
  <div class="logo"></div>
  <h1 id="title">Going back to BB-8…</h1>
  <p id="msg">This page only passes your sign-in back to your robot at home.</p>
</main>
<script>
// Sign-in bridge for BB-8 (https://github.com/erickdsama/bb8, docs/oauth).
// Services like Zapier only send sign-ins to a fixed https address, and the
// robot lives at a local address (http://bb8.local:8765). The robot puts its own
// callback address in "state"; this page sends the browser there with the code.
// The code alone is useless: the robot holds the PKCE secret that redeems it.
// Only local addresses are allowed, so this page cannot be used to send people
// anywhere on the internet.
(function () {
  var q = new URLSearchParams(location.search);
  var fail = function (m) { document.getElementById("title").textContent = "Can't go back to BB-8"; document.getElementById("msg").textContent = m; };
  var ret;
  try {
    var s = (q.get("state") || "").replace(/-/g, "+").replace(/_/g, "/");
    ret = new URL(JSON.parse(atob(s + "===".slice((s.length + 3) % 4))).r);
  } catch (e) { return fail("This link is incomplete. Start again from BB-8's settings page."); }
  var h = ret.hostname;
  var local = /^(localhost|127(\.\d+){3}|10(\.\d+){3}|192\.168(\.\d+){2}|172\.(1[6-9]|2\d|3[01])(\.\d+){2}|\[?::1\]?|[^.]+|.+\.(local|lan|home|internal|home\.arpa))$/i.test(h);
  if (!local || (ret.protocol !== "http:" && ret.protocol !== "https:") || ret.pathname !== "/api/connections/callback") {
    return fail("That address is not a robot on a home network.");
  }
  ["code", "state", "error", "error_description", "iss"].forEach(function (k) { if (q.has(k)) ret.searchParams.set(k, q.get(k)); });
  location.replace(ret.toString());
})();
</script>
</body>
</html>
