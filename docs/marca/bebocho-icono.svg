<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Bebocho</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%"><stop offset="0" stop-color="#2b0e04"/><stop offset="1" stop-color="#0d0706"/></radialGradient>
    <radialGradient id="shell" cx="38%" cy="30%" r="80%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6ddd5"/></radialGradient>
    <clipPath id="ball"><circle cx="270" cy="320" r="148"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- rolling lines -->
  <g stroke="#ff5a00" stroke-width="12" stroke-linecap="round" opacity=".85">
    <line x1="56" y1="300" x2="96" y2="300"/><line x1="40" y1="340" x2="92" y2="340"/><line x1="64" y1="380" x2="100" y2="380"/>
  </g>
  <!-- body, rotated as it rolls -->
  <circle cx="270" cy="320" r="148" fill="url(#shell)"/>
  <g clip-path="url(#ball)" fill="none" stroke="#ff5a00" transform="rotate(-18 270 320)">
    <circle cx="270" cy="320" r="60" stroke-width="20"/>
    <circle cx="270" cy="320" r="25" fill="#ff5a00" stroke="none"/>
    <circle cx="128" cy="302" r="68" stroke-width="18"/>
    <circle cx="412" cy="302" r="68" stroke-width="18"/>
    <circle cx="270" cy="486" r="72" stroke-width="18"/>
  </g>
  <!-- head, tilted: curious -->
  <g transform="rotate(-14 262 172)">
    <path d="M176 176 A86 86 0 0 1 348 176 Z" fill="url(#shell)"/>
    <rect x="172" y="168" width="180" height="14" rx="7" fill="#ff5a00"/>
    <circle cx="262" cy="128" r="27" fill="#140c0a"/>
    <circle cx="253" cy="119" r="9" fill="#ff8533"/>
    <circle cx="268" cy="137" r="3.5" fill="#fff" opacity=".8"/>
    <circle cx="308" cy="152" r="9" fill="#140c0a"/>
    <line x1="306" y1="99" x2="306" y2="64" stroke="#d9d0c8" stroke-width="5" stroke-linecap="round"/>
    <line x1="290" y1="93" x2="290" y2="76" stroke="#d9d0c8" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
